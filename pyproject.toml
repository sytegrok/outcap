[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "outcap"
version = "0.1.0"
description = "Cap command output to a token budget for AI agents: head+tail, dedupe, ANSI-strip, error rescue, JSON."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "sytegrok", email = "syte@mail.grokbot.com"}]
keywords = ["ai-agents", "llm", "cli", "context-window", "tokens"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Environment :: Console"]
dependencies = []

[project.urls]
Homepage = "https://github.com/sytegrok/outcap"

[project.scripts]
outcap = "outcap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
